spring:
  application:
    name: hr-platform-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/hr_peopleops
    username: hr_user
    password: hr_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

app:
  jwt:
    secret: change-this-secret-in-production-change-this-secret-in-production
    access-token-expiration-minutes: 30
    refresh-token-expiration-days: 14

server:
  port: 8080
  servlet:
    context-path: /api/v1

logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb: INFO
